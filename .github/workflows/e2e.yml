name: E2E

on:
  workflow_dispatch:
  schedule:
    # Nightly às 03:00 UTC
    - cron: "0 3 * * *"

jobs:
  e2e:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_SUPERADMIN_EMAIL: ${{ secrets.E2E_SUPERADMIN_EMAIL }}
      E2E_SUPERADMIN_PASSWORD: ${{ secrets.E2E_SUPERADMIN_PASSWORD }}
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
      E2E_TEAM_EMAIL: ${{ secrets.E2E_TEAM_EMAIL }}
      E2E_TEAM_PASSWORD: ${{ secrets.E2E_TEAM_PASSWORD }}
      E2E_CLIENT_A_NAME: ${{ secrets.E2E_CLIENT_A_NAME }}
      E2E_CLIENT_B_NAME: ${{ secrets.E2E_CLIENT_B_NAME }}
      # Supabase env (necessário se rodar contra dev local)
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
